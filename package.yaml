name:                example
version:             0.1.0.0
github:              "Meowcolm024/inference"
license:             BSD-3-Clause
author:              "Meowcolm024"
copyright:           "2026 Meowcolm024"

extra-source-files:
- README.md
- CHANGELOG.md
- LICENSE

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/Meowcolm024/haskell-template#readme>

dependencies:
- base >= 4.7 && < 5

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints
  - -Wunused-imports
  - -Werror
  - -fprint-explicit-foralls
  - -fprint-explicit-kinds

default-extensions:
  - DataKinds
  - DerivingVia
  - GADTs
  - LambdaCase
  - MultiWayIf
  - NoStarIsType
  - OverloadedStrings
  - StrictData
  - TypeFamilies
  - ViewPatterns

language: GHC2021

library:
  source-dirs: src

executables:
  example-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - example

tests:
  example-test:
    main:                Spec.hs
    source-dirs:
    - test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - example
